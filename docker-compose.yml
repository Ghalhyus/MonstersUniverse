# Monsuta Potaru en production : l'application + Caddy (porte d'entrée HTTPS, certificat automatique).
# Réglages dans le fichier .env (voir .env.example). Lancement : docker compose up -d --build
name: monsuta-potaru # nom fixe : le volume de données s'appelle toujours monsuta-potaru_monsuta-potaru-data

services:
  monsuta-potaru:
    build: .
    restart: unless-stopped
    environment:
      # Code d'invitation de départ : gardé en base au premier démarrage, puis géré depuis la page « Administration ».
      - Bank__InviteCode=${INVITE_CODE:?INVITE_CODE manquant dans .env}
      # Pseudo du premier administrateur (tant que le site n'en a aucun).
      - Bank__AdminPseudo=${ADMIN_PSEUDO:-}
      # Caddy transmet l'adresse et le protocole (https) d'origine : l'application les prend en compte
      # (cookies marqués « sécurisés »...). Sans risque : l'application n'est joignable qu'à travers Caddy.
      - ASPNETCORE_FORWARDEDHEADERS_ENABLED=true
    volumes:
      - monsuta-potaru-data:/app/Data # base SQLite, copies de sécurité, clés de connexion
      # Images (Pokémon, objets, sprites Donjon Mystère) : dossier du serveur, rempli par deploy\images-serveur.cmd,
      # hors de la sauvegarde nocturne (elles se retéléchargent).
      - ../monsuta-potaru-images:/app/wwwroot/images:ro

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      # Sans nom de domaine : site en HTTP simple sur l'adresse IP, pour tester uniquement.
      - DOMAIN=${DOMAIN:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data # certificats HTTPS
      - caddy-config:/config
    depends_on:
      - monsuta-potaru

volumes:
  monsuta-potaru-data:
  caddy-data:
  caddy-config:
