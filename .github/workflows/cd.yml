# Déploiement continu de Monsuta Potaru (README, section « CI/CD ») : bouton « Run workflow » de l'onglet Actions, sur
# main seulement. Il ne relance pas les tests : il lit le résultat de la CI (ci.yml) déjà passée sur ce commit, et
# refuse de déployer si elle a échoué, n'a pas fini ou n'a pas tourné (case « Forcer » pour passer outre). Puis
# sauvegarde des données, envoi du code (même archive que deploy\publier.ps1), images manquantes (outils/images.py,
# comme deploy\images-serveur.cmd), reconstruction Docker, et vérification que le site répond.
# Dépôt public : les journaux des Actions sont visibles de tous, n'y afficher ni secret ni donnée du site.
# Secrets du dépôt : VPS_HOST (adresse IP), VPS_USER (debian), VPS_SSH_KEY (clé privée réservée à GitHub),
# VPS_KNOWN_HOSTS (empreinte du serveur, ssh-keyscan).
name: CD

on:
  workflow_dispatch:
    inputs:
      forcer:
        description: "Forcer : déployer même si la CI de ce commit a échoué ou n'a pas fini"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read # lire le résultat de la CI

env:
  DOSSIER: monsuta-potaru # dossier du site sur le VPS (comme publier.ps1)

jobs:
  deploiement:
    name: Déploiement
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploiement-production # jamais deux déploiements à la fois
      cancel-in-progress: false
    steps:
      # Dernière exécution de la CI sur ce commit (gh est installé sur les machines de GitHub).
      - name: Résultat de la CI
        env:
          GH_TOKEN: ${{ github.token }}
          FORCER: ${{ inputs.forcer }}
        run: |
          resultat=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&per_page=1" \
            --jq '.workflow_runs[0] | if . == null then "absente" elif .status != "completed" then "en cours" else .conclusion end')
          commit=${GITHUB_SHA::7}
          case "$resultat" in
            success) echo "CI réussie sur $commit : déploiement." ; exit 0 ;;
            absente) message="Aucune CI sur $commit." ;;
            "en cours") message="La CI de $commit n'a pas encore fini : attends son résultat." ;;
            *) message="La CI de $commit a échoué ($resultat)." ;;
          esac
          if [ "$FORCER" = "true" ]; then
            echo "::warning title=CI::$message Déploiement forcé."
          else
            echo "::error title=CI::$message Déploiement annulé (coche « Forcer » pour déployer quand même)."
            exit 1
          fi

      - uses: actions/checkout@v7

      - name: Accès SSH au VPS
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          if [ -z "$VPS_SSH_KEY" ] || [ -z "$VPS_KNOWN_HOSTS" ] || [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ]; then
            echo "::error::Secrets VPS_HOST, VPS_USER, VPS_SSH_KEY ou VPS_KNOWN_HOSTS manquants : voir la section « CI/CD » du README."
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # Même contenu que deploy\publier.ps1 : sans les images (dossier ~/monsuta-potaru-images du serveur).
      - name: Envoi du code
        env:
          CIBLE: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
        run: |
          tar -czf "$RUNNER_TEMP/monsuta-potaru.tgz" --exclude=bin --exclude=obj --exclude=MonsutaPotaru/wwwroot/images \
            Dockerfile .dockerignore docker-compose.yml Caddyfile .env.example MonsutaPotaru.sln MonsutaPotaru deploy outils
          scp -o BatchMode=yes "$RUNNER_TEMP/monsuta-potaru.tgz" "$CIBLE:monsuta-potaru.tgz"

      - name: Sauvegarde, mise à jour, images et vérification
        env:
          CIBLE: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
        run: |
          ssh -o BatchMode=yes "$CIBLE" "DOSSIER=$DOSSIER bash -s" <<'SCRIPT'
          set -euo pipefail
          if [ ! -f "$DOSSIER/.env" ]; then
            echo "Site pas encore installé sur ce VPS : première installation avec deploy\publier.cmd (voir le README)."
            exit 1
          fi

          echo "== Sauvegarde des données"
          # Absent seulement au premier déploiement après deploy\renommer-serveur.cmd (dossier qui n'a que le .env) :
          # ce script vient de faire la sauvegarde.
          if [ -f "$DOSSIER/deploy/sauvegarder.sh" ]; then
            bash "$DOSSIER/deploy/sauvegarder.sh"
          else
            echo "Premier déploiement dans $DOSSIER : sauvegarde déjà faite par renommer-serveur."
          fi

          echo "== Mise à jour"
          # Dossier des images créé avant Docker : sinon Docker le crée au nom de root (voir publier.ps1).
          mkdir -p ~/monsuta-potaru-images
          rm -rf "$DOSSIER/MonsutaPotaru/wwwroot/images"
          tar -xzf monsuta-potaru.tgz -C "$DOSSIER"
          cd "$DOSSIER"

          echo "== Images"
          # Seulement celles qui manquent (les présentes sont gardées) : nouvelles images d'une fonctionnalité, nouvelles
          # espèces... Avant la reconstruction : le site qui démarre lit la liste des images. Un échec ne bloque pas le
          # déploiement (le site affiche les images de remplacement) : avertissement orange dans GitHub, et seulement le
          # résumé dans le journal (journal complet sur le VPS : ~/monsuta-potaru-images.log).
          if ! command -v python3 > /dev/null; then
            echo "::warning title=Images::Python 3 manque sur le VPS (sudo apt install python3) : images pas mises à jour."
          elif python3 outils/images.py --sortie ~/monsuta-potaru-images > ~/monsuta-potaru-images.log 2>&1; then
            grep -E " images, | introuvable " ~/monsuta-potaru-images.log || true
          else
            grep -E " images, | introuvable |erreur" ~/monsuta-potaru-images.log | head -n 20 || true
            echo "::warning title=Images::Images incomplètes (voir ci-dessus, ou ~/monsuta-potaru-images.log sur le VPS) : relancer deploy\images-serveur.cmd."
          fi

          docker compose up -d --build
          docker image prune -f > /dev/null

          echo "== Vérification"
          # Depuis le conteneur de Caddy (réseau interne de Docker) ; X-Forwarded-Proto comme Caddy, pour éviter la
          # redirection vers HTTPS. Une minute au plus : migrations et remplissages du démarrage compris.
          for essai in $(seq 30); do
            if docker compose exec -T caddy wget -q -O /dev/null --header "X-Forwarded-Proto: https" http://monsuta-potaru:8080/; then
              # Le script de Blazor aussi : sans lui, les pages s'affichent mais aucune n'est interactive (.NET 10 :
              # RequiresAspNetWebAssets dans MonsutaPotaru.csproj).
              if ! docker compose exec -T caddy wget -q -O /dev/null --header "X-Forwarded-Proto: https" http://monsuta-potaru:8080/_framework/blazor.web.js; then
                echo "::error title=Déploiement::Le site répond, mais _framework/blazor.web.js est introuvable : aucune page ne sera interactive."
                exit 1
              fi
              echo "Monsuta Potaru est à jour et répond."
              exit 0
            fi
            sleep 2
          done
          # Pas de journal ici : ceux des Actions sont publics (dépôt public), celui du site contient des identifiants.
          echo "Le site ne répond pas après une minute. Journal (depuis ton PC) :"
          echo "  ssh UTILISATEUR@IP_DU_VPS \"cd $DOSSIER && docker compose logs --tail 50 monsuta-potaru\""
          exit 1
          SCRIPT
